services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ampratas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8090
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ampratas
      DB_USERNAME: ampratas
      DB_PASSWORD: ampratas
      FILESYSTEM_DISK: public
      MEDIA_DISK: public
      AWS_ACCESS_KEY_ID: change_me
      AWS_SECRET_ACCESS_KEY: change_me
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ampratas
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:9000/ampratas
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ampratas
      - miniio_minionet

  nginx:
    image: nginx:1.27-alpine
    container_name: ampratas-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ampratas

  mysql:
    image: mysql:8.4
    container_name: ampratas-mysql
    restart: unless-stopped
    ports:
      - "3311:3306"
    environment:
      MYSQL_DATABASE: ampratas
      MYSQL_USER: ampratas
      MYSQL_PASSWORD: ampratas
      MYSQL_ROOT_PASSWORD: root_ampratas
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_ampratas"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ampratas

networks:
  ampratas:
    driver: bridge
  miniio_minionet:
    external: true

volumes:
  mysql_data:
